<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00B854" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Shield / Terminal Base -->
  <rect width="64" height="64" rx="14" fill="#080B0F" stroke="#1B3A2E" stroke-width="2"/>
  <!-- Cyber Hex Grid subtle line -->
  <path d="M12 20 L32 8 L52 20 L52 44 L32 56 L12 44 Z" fill="#101820" stroke="#00FF88" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- Stylized "8" with terminal brackets -->
  <text x="32" y="39" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="url(#cyberGreen)" text-anchor="middle" filter="url(#glow)">8</text>
  <!-- Mini terminal prompt dot -->
  <circle cx="48" cy="16" r="3" fill="#00FF88" />
</svg>
